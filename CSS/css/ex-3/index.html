<!DOCTYPE html>

    <title>Selectors Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ID Selector Example -->

        <h1>Local Community Event Portal</h1>

        <p>Join us for a fun-filled evening of music and entertainment.</p>
    </div>

    <div class="eventCard">
        <h3>Food Fair</h3>

    </div>

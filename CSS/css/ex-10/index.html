<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Community Event Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Community Event Portal</h1>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <ul class="nav-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Responsive Flexbox Layout -->
    <section class="container">

        <div class="event-card">
            <img src="https://via.placeholder.com/300x200" alt="Event">
            <h2>Music Festival</h2>
            <p>Enjoy live music performances and cultural activities.</p>
        </div>

        <div class="event-card">
            <img src="https://via.placeholder.com/300x200" alt="Event">
            <h2>Food Fair</h2>
            <p>Explore delicious cuisines from around the city.</p>
        </div>

        <div class="event-card">
            <img src="https://via.placeholder.com/300x200" alt="Event">
            <h2>Sports Meet</h2>
            <p>Participate in exciting sports and fitness activities.</p>
        </div>

    </section>

</body>
</html>

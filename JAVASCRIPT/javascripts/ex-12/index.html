<!DOCTYPE html>
<html>
<head>

<title>Event Registration</title>

<style>

#message{
font-weight:bold;
margin-top:10px;
}

</style>

</head>

<body>

<h1>Community Event Registration</h1>

<form id="registerForm">

<label>Name:</label>
<input type="text" id="name">

<br><br>

<label>Email:</label>
<input type="email" id="email">

<br><br>

<label>Event:</label>

<select id="event">

<option>Music Fest</option>

<option>Workshop on Baking</option>

<option>Dance Show</option>

</select>

<br><br>

<button type="submit">
Register
</button>

</form>

<p id="message"></p>

<script src="main.js"></script>

</body>
</html>
